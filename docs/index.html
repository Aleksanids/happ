<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Стриж — открыть в Happ</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111522;color:#f0f3ff}
    body{margin:0;min-height:100svh;display:grid;place-items:center}
    main{width:min(32rem,calc(100% - 3rem));padding:2rem 0}
    .brand{color:#aebcff;letter-spacing:.15em;font-size:.8rem;font-weight:700}
    h1{font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.15;margin:.8rem 0 1rem}
    p{line-height:1.65;color:#bfc8e1} .actions{display:grid;gap:.8rem;margin:1.6rem 0}
    a{color:inherit} .action{display:block;text-align:center;text-decoration:none;border-radius:.8rem;padding:1rem;background:#6b66f4;color:white;font-weight:700;border:1px solid #9793ff}
    .action:focus-visible{outline:3px solid #e4c96d;outline-offset:4px}
    small{display:block;color:#9daac8;line-height:1.6} #status{min-height:3.3em}
      .action[hidden]{display:none}
  </style>
</head>
<body>
<main>
  <div class="brand">СТРИЖ · VPN</div>
  <h1 id="heading">Открываем страницу подписки</h1>
  <p id="status" role="status">Перенаправляем на отдельную страницу вашей подписки.</p>
  <a class="action" id="continue" hidden>Продолжить</a>
  <noscript><p>Для этой старой ссылки нужен JavaScript. Используйте новую отдельную ссылку вашей подписки.</p></noscript>
</main>
<script>
(() => {
  'use strict';
  const destinations = Object.freeze({'':'./speed/','#speed':'./speed/','#dots':'./dots/'});
  const key = location.hash;
  if (!Object.prototype.hasOwnProperty.call(destinations,key)) {
    document.getElementById('heading').textContent = 'Ссылка не распознана';
    document.getElementById('status').textContent = 'Откройте отдельную ссылку нужной подписки.';
    return;
  }
  const target = destinations[key];
  const link = document.getElementById('continue');
  link.href = target; link.hidden = false;
  window.location.replace(target);
})();
</script>
</body>
</html>
